{% extends "layout.html" %}
{% block title %}{{ title }} — Westway Tennis Alerts{% endblock %}

{% block content %}
<div class="card center">
  <div class="result-icon">{{ icon }}</div>
  <h1>{{ title }}</h1>
  <p class="lead">{{ body }}</p>
  {% if sub_body %}
    <p class="hint">{{ sub_body }}</p>
  {% endif %}
  <a href="/" class="btn-back">← Back to home</a>
</div>
{% endblock %}
